<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공구 AI 분석</title>
  <style>
    body { font-family: 'Noto Sans KR', Arial, sans-serif; background: #f7f7f7; margin: 0; }
    .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
    h2 { text-align: center; color: #333; }
    .result { margin-top: 24px; background: #f0f0f0; border-radius: 8px; padding: 16px; }
    label { font-weight: bold; }
    input[type=file] { margin: 12px 0; }
    button { background: #1976d2; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 1em; }
    button:hover { background: #1565c0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>공구 이미지 AI 분석</h2>
    <form id="uploadForm">
      <label for="toolImage">공구 이미지 업로드:</label><br>
      <input type="file" id="toolImage" name="toolImage" accept="image/*" required><br>
      <button type="submit">분석하기</button>
    </form>
    <div class="result" id="resultBox" style="display:none;"></div>
  </div>
  <script>
    const form = document.getElementById('uploadForm');
    const resultBox = document.getElementById('resultBox');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('toolImage');
      if (!fileInput.files.length) return;
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      resultBox.style.display = 'none';
      resultBox.innerHTML = '분석 중...';
      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        let html = '';
        if (data.detected_tool) {
          html += `<b>공구명:</b> ${data.detected_tool}<br>`;
        }
        if (data.tool_info) {
          html += `<b>브랜드:</b> ${data.tool_info.brand}<br>`;
          html += `<b>분류:</b> ${data.tool_info.category}<br>`;
          html += `<b>특징:</b> ${data.tool_info.features.join(', ')}<br>`;
          html += `<b>매뉴얼:</b> <a href="${data.tool_info.manual_url}" target="_blank">다운로드</a><br>`;
          html += `<b>수명:</b> ${data.tool_info.lifetime}<br>`;
          html += `<b>AS센터:</b> ${data.tool_info.as_center}<br>`;
        } else {
          html += '공구 정보를 찾을 수 없습니다.';
        }
        resultBox.innerHTML = html;
        resultBox.style.display = 'block';
      } catch (err) {
        resultBox.innerHTML = '분석 실패: ' + err;
        resultBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
